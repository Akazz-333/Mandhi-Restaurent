spring.application.name=restaurant
server.port=${PORT:8080}

# Fail-Safe Database Configuration (Uses Spring/MySQL env variables if set, defaults to H2 so server NEVER crashes)
spring.datasource.url=${SPRING_DATASOURCE_URL:${MYSQL_URL:jdbc:h2:mem:mandhi_db;DB_CLOSE_DELAY=-1;MODE=MySQL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:${MYSQLDRIVER:org.h2.Driver}}

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.format_sql=false

# HikariCP Connection Pool (Prevents database timeout & memory exhaustion crashes)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

# Max upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
