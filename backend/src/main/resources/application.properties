spring.application.name=restaurant
server.port=${PORT:8081}

# Database Connection (Uses Railway/MySQL env variables if set, otherwise falls back to H2)
spring.datasource.url=${MYSQL_URL:${SPRING_DATASOURCE_URL:jdbc:h2:mem:mandhi_db;DB_CLOSE_DELAY=-1;MODE=MySQL}}
spring.datasource.username=${MYSQLUSER:${SPRING_DATASOURCE_USERNAME:sa}}
spring.datasource.password=${MYSQLPASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=${MYSQLDRIVER:${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# HikariCP Connection Pool (Prevents database timeout & memory exhaustion crashes)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

# Max upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
